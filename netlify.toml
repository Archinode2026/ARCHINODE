[build]
  publish = "."

# 2026-11-03 A-151: Netlify 시크릿 스캐너(smart detection)가 firebase-config.js 의
# Firebase 웹 API 키(AIza...)를 "비밀키처럼 생겼다"는 이유로 잡아 빌드가 실패했다.
# 이 키는 Firebase 설계상 공개 값이다 — 프로젝트를 식별할 뿐이고 접근 통제는
# Firestore 보안 규칙이 한다. 따라서 이 값 하나만 예외로 둔다.
# 환경변수 기반 스캔(RECAPTCHA_SECRET_KEY 등)은 그대로 살아 있다.
# ※ Firebase 콘솔에서 웹 API 키를 재발급하면 아래 값도 함께 갱신해야 한다.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBkCqq4V1KIkKjiIH46nZd-0cJaSVPSg9k"

# A-004(2026-11-03): reCAPTCHA v3 서버 검증용 Netlify Function.
# 비밀 키(RECAPTCHA_SECRET_KEY)는 Netlify 대시보드 환경변수로만 설정 — 이 파일/레포에는 절대 없음.
# A-290(2026-11-05): Netlify 후처리(Asset Optimization)를 저장소에서 명시적으로 끈다.
#
# 증상 — 기기 파일은 멀쩡한데 **라이브만** HTML 속성이 깨졌다(브론즈 라이브 실측):
#   기기:   onmouseover="this.style.background='#d9b883'"
#   라이브: onmouseover='this.style.background=\'#d9b883\''   ← 유효하지 않은 HTML
# 후처리가 쌍따옴표 속성을 홑따옴표로 재직렬화하면서 내부 아포스트로피를
# 백슬래시로 이스케이프한다. HTML 속성은 백슬래시를 모르므로 파서가 그 지점에서
# 속성을 끊고, 뒤따르는 속성들이 유령 속성이 된다.
# 실제 피해: for-brands.html 「Request Consultation」 호버 사망 + JS SyntaxError,
#            auth/login.html 영어 헤더가 「Don\」 로 표시, admin/dashboard.html 호버 20건 사망.
# 같은 후처리가 href 의 .html 확장자도 떼어낸다(signup.html → /auth/signup) —
# 이 저장소는 .html 링크를 쓰므로 그것도 원하지 않는 변형이다.
#
# ★ 2026-11-05 실측 정정: **이 설정만으로는 멈추지 않았다.**
#   배포가 반영된 뒤에도 라이브 HTML 이 그대로 깨져 있었다(admin/dashboard.html 20건).
#   실제로 멈춘 것은 Netlify 대시보드의
#     Project configuration → Developer settings → Post processing → **Pretty URLs** 끄기
#   (예전 "Asset optimization" 은 없어졌고 Pretty URLs 가 그 역할을 한다.)
#   끈 뒤 Trigger deploy 를 해야 적용된다 — 후처리는 배포 시점에 걸린다.
#   아래 줄은 남겨 둔다(해롭지 않고 의도를 기록한다). 다만 **이 줄을 믿지 마라** —
#   증상이 돌아오면 먼저 대시보드의 Pretty URLs 를 확인해라.
[build.processing]
  skip_processing = true

# ── 캐시 헤더 실측 (2026-11-12, A-480 작업 중) ──────────────────────────────
# 라이브에서 fetch 로 재 보니 모든 자산이
#   cache-control: public,max-age=0,must-revalidate  + ETag
# 였다(search.js · category-products.js · admin/js/admin-core.js · style.css · about.html).
# 즉 **브라우저는 매번 되묻고 바뀐 파일을 받는다** — HTML 에 붙은 `?v=` 는 관례일 뿐이고,
# .js 를 고쳤을 때 `?v=` 를 올리지 않아도 돌아온 손님에게 옛 파일이 남지 않는다
# (A-466 · A-468 · A-471~473 이 전부 `?v=` 를 안 올린 경우였는데 라이브는 멀쩡했다).
# ★ `_headers` 에 .js/.css 의 max-age 를 길게 주거나 immutable 을 붙이는 순간 그 전제가
#   깨진다 — 그때는 파일을 고칠 때마다 `?v=` 를 함께 올려야 한다. 둘은 한 쌍이다.

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
