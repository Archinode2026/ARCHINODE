<title>Log In | ARCHINODE</title>

<link rel="stylesheet" href="../style.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background: var(--gray-100); min-height: 100vh; display: flex; flex-direction: column; }

.auth-header {
    background: var(--black); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
}
.auth-header .logo { color: var(--white); font-size: 1.3rem; font-weight: 800; text-decoration: none; letter-spacing: -0.5px; }
.auth-header .logo span { font-size: 0.6rem; font-weight: 400; color: var(--gray-400); margin-left: 4px; }
.auth-header .nav-link { color: var(--gray-400); font-size: 0.82rem; text-decoration: none; }
.auth-header .nav-link:hover { color: var(--navy-gold); }
/* A-206 — 언어 스위처 자리. 없으면 lang.js 가 화면 우상단에 고정 버튼을 띄우고
   그게 이 헤더의 '회원가입'/'로그인' 링크를 덮어 클릭까지 가로챘다. */
.auth-header-right { display: flex; align-items: center; gap: 14px; }

.auth-container {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px;
}
.auth-box {
    background: var(--white); border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    padding: 48px 40px; max-width: 420px; width: 100%;
}
.auth-box h1 { font-size: 1.6rem; font-weight: 800; color: var(--black); margin-bottom: 6px; }
.auth-box .subtitle { font-size: 0.88rem; color: var(--ink-soft); margin-bottom: 28px; }

.field { margin-bottom: 20px; }
.field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--black); margin-bottom: 6px; }
.field input {
    width: 100%; padding: 12px 16px; border: 1px solid var(--gray-300); border-radius: var(--radius);
    font-size: 0.95rem; font-family: inherit; transition: border-color 0.3s;
}
.field input:focus { outline: none; border-color: var(--accent); }

.auth-btn {
    width: 100%; background: var(--black); color: var(--white); border: none; padding: 14px;
    border-radius: 999px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: background 0.3s; font-family: inherit; margin-top: 8px;
}
.auth-btn:hover { background: var(--accent); }
.auth-btn:disabled { background: var(--gray-400); cursor: not-allowed; }

.auth-links { text-align: center; margin-top: 20px; font-size: 0.82rem; color: var(--ink-soft); line-height: 1.8; }
.auth-links a { color: var(--accent-ink); text-decoration: none; }
.auth-links a:hover { text-decoration: underline; }

.error-msg {
    display: none; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
    padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 0.85rem;
}
.success-msg {
    display: none; background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d;
    padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 0.85rem;
}

/* R-067: '왜 이 화면으로 왔는지' 한 줄 안내. 경고가 아니므로 중립 색으로 둔다. */
.next-msg {
    display: none; background: var(--gray-50); border: 1px solid var(--gray-200); color: var(--gray-700);
    padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 0.85rem;
    word-break: keep-all; line-height: 1.6;
}
.next-msg i { color: var(--accent-ink); margin-right: 6px; }

.reset-section { display: none; }
.back-link { display: inline-block; margin-top: 12px; color: var(--accent-ink); font-size: 0.85rem; cursor: pointer; }

@media (max-width: 480px) {
    .auth-box { padding: 32px 24px; }
}

/* 제목은 사이트 공통 서체로, 한글 제목은 어절 단위로 끊는다 (A-184) */
.auth-box h1, .reset-box h1, .success-box h2, .invalid-box h2,
.welcome h1, .section-card h2, .benefits h3, .role-card .role-title, .empty-state h3 {
    font-family: 'Lora', 'Noto Serif KR', Georgia, serif;
    font-weight: 500; letter-spacing: -0.012em; word-break: keep-all;
}
html[lang="ko"] .auth-box h1, html[lang="ko"] .reset-box h1,
html[lang="ko"] .welcome h1 { letter-spacing: -0.005em; }
.auth-box .subtitle, .reset-box .subtitle, .auth-links, .field label,
.benefits li, .terms-check, .role-card .role-desc { word-break: keep-all; }
</style>

<body>

<div class="auth-header">
    <a href="../index.html" class="logo">ARCHINODE <span>건축을 잇다</span></a>
    <div class="auth-header-right"><a href="signup.html" class="nav-link" data-en="Don't have an account? Sign up" data-ko="계정이 없으신가요? 회원가입">Don't have an account? Sign up</a>
    <a href="#" class="lang-switch" onclick="toggleLang(event)">KR / EN</a></div>
</div>

<div class="auth-container">
    <div class="auth-box">
        <!-- LOGIN FORM -->
        <div id="loginSection">
            <h1 data-en="Welcome Back" data-ko="다시 오신 것을 환영합니다">Welcome Back</h1>
            <p class="subtitle" data-en="Log in to your ARCHINODE account." data-ko="ARCHINODE 계정에 로그인하세요.">Log in to your ARCHINODE account.</p>
            <!-- R-067: 비로그인으로 어드민·포털 화면에 들어오면 이 자리에 이유를 적는다.
                 전에는 어드민 대시보드가 브랜드 포털 로그인 창으로 보내서 화면 문구가
                 온통 "브랜드" 였다(A-067 에서 통합 로그인으로 바꿨다). 지금 문구는
                 중립이지만, 왜 로그인 창이 떴는지는 여전히 알 수 없었다. -->
            <p class="next-msg" id="loginNextHint"></p>

            <div class="error-msg" id="loginError"></div>

            <form id="loginForm">
                <div class="field">
                    <label data-en="Email" data-ko="이메일">Email</label>
                    <input type="email" id="loginEmail" required placeholder="name@company.com">
                </div>
                <div class="field">
                    <label data-en="Password" data-ko="비밀번호">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password" data-en-placeholder="Enter your password" data-ko-placeholder="비밀번호 입력">
                </div>
                <button type="submit" class="auth-btn" id="loginBtn" data-en="Log In" data-ko="로그인">Log In</button>
            </form>

            <div class="auth-links">
                <a href="#" id="showReset" data-en="Forgot password?" data-ko="비밀번호를 잊으셨나요?">Forgot password?</a><br>
                <span data-en="Don't have an account?" data-ko="계정이 없으신가요?">Don't have an account?</span>
                <a href="signup.html" data-en="Sign up for free" data-ko="무료 회원가입">Sign up for free</a><br>
                <!-- 2026-11-03 A-152: 로그인 창 통합 — 브랜드도 이 창에서 로그인한다.
                     별도 "브랜드 포털" 링크는 자기 자신을 가리키게 되므로 제거하고,
                     아직 입점 전인 브랜드를 위한 신청 경로만 남긴다. -->
                <span data-en="Want to list your brand?" data-ko="브랜드를 입점시키려면?">Want to list your brand?</span>
                <a href="../list-your-brand.html" data-en="Apply to list" data-ko="입점 신청">Apply to list</a>
            </div>
        </div>

        <!-- RESET PASSWORD -->
        <div id="resetSection" class="reset-section">
            <h1 data-en="Reset Password" data-ko="비밀번호 재설정">Reset Password</h1>
            <p class="subtitle" data-en="Enter your email to receive a password reset link." data-ko="비밀번호 재설정 링크를 받으려면 이메일을 입력하세요.">Enter your email to receive a password reset link.</p>
            <div class="error-msg" id="resetError"></div>
            <div class="success-msg" id="resetSuccess"></div>
            <form id="resetForm">
                <div class="field">
                    <label data-en="Email" data-ko="이메일">Email</label>
                    <input type="email" id="resetEmail" required placeholder="name@company.com">
                </div>
                <button type="submit" class="auth-btn" data-en="Send Reset Link" data-ko="재설정 링크 전송">Send Reset Link</button>
            </form>
            <span class="back-link" id="backToLogin"><i class="fas fa-arrow-left"></i> <span data-en="Back to login" data-ko="로그인으로 돌아가기">Back to login</span></span>
        </div>
    </div>
</div>

<script src="../firebase-config.js"></script>
<script src="../lang.js?v=20261106a"></script>
<script>
// ── R-069: ?next= — 원래 보려던 페이지로 돌려보낸다 ──
// 어드민 별도 페이지 5개와 bim-download 는 예전부터 `?next=/admin/...` 를 붙여 보냈는데,
// 이 화면이 그 값을 읽은 적이 없어 로그인하면 늘 대시보드(또는 내 계정)로 떨어졌다.
// 바깥 주소로 튕기는 열린 리디렉션이 되지 않게, **같은 사이트의 절대 경로만** 받는다.
// 스킴 검사가 따로 필요한 이유는 A-218 과 같다 — `javascript:` 에는 이스케이프할 글자가 없다.
function loginNextUrl() {
    var raw = '';
    try { raw = new URLSearchParams(window.location.search).get('next') || ''; } catch (e) { return ''; }
    if (!raw) return '';
    var u;
    try { u = new URL(raw, window.location.origin); } catch (e) { return ''; }
    // `//evil.com` 은 브라우저가 외부 주소로 읽고, `javascript:`·`data:` 는 origin 이 다르게 나온다.
    if (u.origin !== window.location.origin) return '';
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
    var path = u.pathname + u.search + u.hash;
    // 로그인 화면 자신으로 돌아오면 무한 왕복이 된다.
    if (/\/auth\/(login|signup)\.html$/i.test(u.pathname)) return '';
    return path;
}

// ── R-067: 어느 화면 때문에 로그인하게 됐는지 한 줄로 알려 준다 ──
// 판단 근거는 ?next= 하나뿐이다(R-069 에서 들인 그 값). 값이 없으면 아무것도 띄우지 않는다.
(function showLoginReason() {
    var nx = loginNextUrl();
    if (!nx) return;
    var el = document.getElementById('loginNextHint');
    if (!el) return;
    var en, ko;
    if (/^\/admin\//i.test(nx)) {
        en = 'That page is for administrators. Log in with an admin account to continue.';
        ko = '그 화면은 관리자 전용입니다. 관리자 계정으로 로그인하면 이어서 열립니다.';
    } else if (/^\/brand-portal\//i.test(nx)) {
        en = 'Log in to continue to the brand portal.';
        ko = '브랜드 포털로 이어서 가려면 로그인해 주세요.';
    } else {
        en = 'Log in and you will return to the page you were on.';
        ko = '로그인하면 보던 화면으로 돌아갑니다.';
    }
    el.setAttribute('data-en', en);
    el.setAttribute('data-ko', ko);
    el.innerHTML = '<i class="fas fa-circle-info" aria-hidden="true"></i>';
    el.appendChild(document.createTextNode(ko));
    el.style.display = 'block';
    // data-en/ko 를 붙인 뒤 현재 언어로 다시 칠한다 (저장된 언어를 건드리지 않는 쪽).
    if (window.applyLangAgain) { try { window.applyLangAgain(); } catch (e) {} }
})();

// ── 세션 유지 ──
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(err => console.warn('Persistence error:', err));

// ── 이미 로그인 상태면 리디렉션 ──
auth.onAuthStateChanged(user => {
    if (user) {
        var next = loginNextUrl();
        if (isAdmin(user.email)) {
            window.location.href = next || '../admin/dashboard.html';
            return;
        }
        // 관리자 전용 경로는 관리자가 아닐 때 따라가지 않는다 — 접근 거부 화면에 떨어뜨리는 대신
        // 그 계정의 제 자리로 보낸다(브랜드는 포털, 그 외는 내 계정).
        if (next && /^\/admin\//i.test(next)) next = '';
        db.collection('brands').doc(user.uid).get().then(doc => {
            if (doc.exists) {
                window.location.href = next || '../brand-portal/dashboard.html';
            } else {
                window.location.href = next || 'profile.html';
            }
        });
    }
});

// ── 로그인 ──
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('loginError');
    errorDiv.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        await auth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged가 리디렉션 처리
    } catch (error) {
        btn.disabled = false;
        btn.textContent = 'Log In';
        errorDiv.style.display = 'block';
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
            errorDiv.textContent = '이메일 또는 비밀번호가 올바르지 않습니다. / Invalid email or password.';
        } else {
            errorDiv.textContent = error.message;
        }
    }
});

// ── 비밀번호 재설정 ──
document.getElementById('showReset').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('resetSection').style.display = 'block';
});
document.getElementById('backToLogin').addEventListener('click', () => {
    document.getElementById('resetSection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
});
document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    const errorDiv = document.getElementById('resetError');
    const successDiv = document.getElementById('resetSuccess');
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    try {
        await auth.sendPasswordResetEmail(email);
        successDiv.style.display = 'block';
        successDiv.textContent = '재설정 이메일을 전송했습니다! / Password reset email sent!';
    } catch (error) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = '이메일 전송에 실패했습니다. 이메일을 확인해주세요. / Could not send reset email.';
    }
});
</script>
<script src="../form-throttle.js?v=20260630" defer></script>
</body>
</html>
