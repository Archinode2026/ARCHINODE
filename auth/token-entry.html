<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- 브론즈(자동 검수) 1회용 열쇠 착륙 페이지 — tools/bronze-token.js 가 #t=<커스텀토큰>&to=<경로> 로 보낸다.
     링크·sitemap 노출 없음. 토큰은 fragment 로만 오고(서버 미전송) 아래 첫 스크립트가 CDN 스크립트보다 먼저 읽어
     주소창·히스토리에서 지운다. 읽은 값은 window.__ae 한 곳에만 잠깐 두고 로그인 시도 직후 delete 한다. -->
<script>
// ── 0) fragment 읽고 즉시 지운다 — 외부 스크립트가 내려오기 전에 (블랙 9222947 WARNING 1) ──
(function () {
    var frag = location.hash.charAt(0) === '#' ? location.hash.slice(1) : '';
    history.replaceState(null, '', location.pathname);
    var p = new URLSearchParams(frag);
    var t = p.get('t') || '';
    var to = p.get('to') || '';
    window.__ae = { t: t, to: to };
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Signing in… — ARCHINODE</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #333; }
#msg { font-size: 0.95rem; text-align: center; padding: 24px; line-height: 1.7; }
#msg.err { color: #dc2626; }
</style>
</head>
<body>
<p id="msg" data-en="Signing in…" data-ko="로그인 중…">Signing in…</p>

<script src="../firebase-config.js"></script>
<script>
(function () {
    // to 는 리포 루트 기준 같은 출처 상대경로만 (예 admin/dashboard.html). 절대 URL·프로토콜·상위 이동은 거부 → 기본값.
    function sanitizeTo(v) {
        var DEFAULT = 'admin/dashboard.html';
        if (typeof v !== 'string' || !v) return DEFAULT;
        if (v.indexOf('//') !== -1 || v.indexOf(':') !== -1 || v.indexOf('..') !== -1 || v.indexOf('\\') !== -1) return DEFAULT;
        if (!/^[a-z0-9][a-z0-9_\-./]*\.html(\?[^\s#]*)?$/i.test(v)) return DEFAULT;
        return v;
    }

    function say(en, ko, isErr) {
        var el = document.getElementById('msg');
        var lang = 'en';
        try { if (localStorage.getItem('archinode-lang') === 'ko') lang = 'ko'; } catch (e) {}
        el.setAttribute('data-en', en);
        el.setAttribute('data-ko', ko);
        el.textContent = lang === 'ko' ? ko : en;
        el.className = isErr ? 'err' : '';
    }

    // ── 1) 로그인 모듈 가드 — SDK·firebase-config.js 가 안 내려왔으면 조용히 죽지 않고 알린다 (블랙 WARNING 2) ──
    //    firebase-config.js 의 `const auth` 는 중간에 throw 하면 TDZ 라 typeof 도 ReferenceError → try 로 감싼다.
    var ready = false;
    try { ready = typeof firebase !== 'undefined' && !!firebase.auth && typeof auth !== 'undefined' && !!auth; } catch (e) {}
    if (!ready) {
        delete window.__ae;
        say('Sign-in service failed to load. Reload or ask for a new key.',
            '로그인 모듈을 불러오지 못했습니다. 새로고침하거나 열쇠를 다시 받으세요.', true);
        return;
    }

    // ── 2) 머리 스크립트가 남긴 값을 꺼내고 전달 객체는 로그인 시도 직후 지운다 ──
    var ae = window.__ae || {};
    var token = ae.t || '';
    var to = sanitizeTo(ae.to);

    if (!token) {
        delete window.__ae;
        say('No sign-in key was provided. Issue a new one with tools/bronze-token.js.',
            '열쇠가 없습니다. tools/bronze-token.js 로 다시 발급받으세요.', true);
        return;
    }

    // ── 3) 토큰으로 로그인 → to 로 이동 ──
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .catch(function (err) { console.warn('Persistence:', err && err.code); })
        .then(function () { var p = auth.signInWithCustomToken(token); token = ''; delete window.__ae; return p; })
        .then(function () { location.replace('../' + to); })
        .catch(function (err) {
            token = ''; delete window.__ae;
            console.error('token-entry sign-in failed:', err && err.code);
            say('The sign-in key has expired or is invalid. Please issue a new one.',
                '열쇠가 만료됐거나 잘못됐습니다. 다시 발급받으세요.', true);
        });
})();
</script>
</body>
</html>
