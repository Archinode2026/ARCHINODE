<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>ARCHINODE Brand Articles</title>
<!-- A-291(2026-11-05): 브랜드 아티클 기사 화면을 magazine/view.html 로 통합했다.
     두 화면이 같은 컬렉션·같은 스키마·같은 status 필터를 쓰면서 조회 키만 달랐고
     (여기는 docId, 저기는 slug), 사이트의 모든 링크가 docId 라서 기능이 더 완성된
     쪽(JSON-LD·og 언어 동기화·브랜드 박스)에 아무도 도달하지 못했다.
     ★ 평소 경로는 _redirects 의 301! 이 서버에서 처리한다. 이 파일은 그게 안 먹을
       때를 위한 보험이다 — 이미 공유된 주소가 죽지 않도록. -->
<script>
(function () {
  var id = '';
  try { id = new URLSearchParams(location.search).get('id') || ''; } catch (e) {}
  location.replace('../magazine/view.html' + (id ? '?id=' + encodeURIComponent(id) : ''));
})();
</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:40px;">
  <span data-en="Redirecting to the article…" data-ko="기사로 이동합니다…">Redirecting to the article&hellip;</span><br>
  <a href="../trend-report.html">ARCHINODE Brand Articles</a>
</p>
</body>
</html>
