<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background: var(--gray-200); color: var(--black); }

.topbar { background: var(--black); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
.topbar .logo { color: var(--white); font-size: 1.1rem; font-weight: 800; text-decoration: none; }
.topbar .logo span { color: var(--navy-gold); font-size: 0.7rem; font-weight: 600; margin-left: 8px; background: rgba(201,163,106,0.15); padding: 2px 8px; border-radius: 3px; }
.topbar .right { display: flex; align-items: center; gap: 16px; }
.topbar .admin-email { color: var(--gray-400); font-size: 0.8rem; }
.topbar .nav-link { color: var(--gray-400); font-size: 0.82rem; font-weight: 500; text-decoration: none; padding: 6px 10px; border-radius: 3px; transition: all 0.2s; }
.topbar .nav-link:hover { color: var(--navy-gold); }
.topbar .nav-link.active { color: var(--navy-gold); }
.topbar .logout-btn { background: none; border: 1px solid var(--gray-400); color: var(--gray-400); padding: 6px 14px; border-radius: 4px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
.topbar .logout-btn:hover { border-color: var(--navy-gold); color: var(--navy-gold); }

.admin { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
.page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.page-head h1 { font-size: 1.4rem; font-weight: 800; }
.page-head .sub { font-size: 0.82rem; color: var(--ink-soft); margin-top: 4px; }
.head-actions { display: flex; gap: 8px; align-items: center; }
.btn { background: var(--black); color: var(--white); border: none; padding: 9px 18px; border-radius: 5px; font-size: 0.85rem; cursor: pointer; font-family: inherit; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--accent); }
.btn.secondary { background: var(--white); color: var(--black); border: 1px solid var(--gray-400); }
.btn.secondary:hover { background: var(--gray-100); color: var(--navy-gold); }
select.filter-select { padding: 8px 12px; border-radius: 5px; border: 1px solid var(--gray-300); font-size: 0.85rem; font-family: inherit; background: var(--white); }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
.stat-card { background: var(--white); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.stat-card .number { font-size: 1.8rem; font-weight: 800; color: var(--black); }
.stat-card .label { font-size: 0.75rem; color: var(--ink-soft); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card.pending { border-left: 4px solid #b45309; }
.stat-card.approved { border-left: 4px solid #047857; }
.stat-card.rejected { border-left: 4px solid #b91c1c; }

.section-card { background: var(--white); border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); padding: 24px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 12px; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--gray-200); white-space: nowrap; }
td { padding: 14px 12px; font-size: 0.85rem; border-bottom: 1px solid var(--gray-100); vertical-align: top; }
tr:hover { background: var(--gray-50); }
td a { color: #1d4ed8; text-decoration: none; }
td a:hover { text-decoration: underline; }

.status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
.status-pending { background: #fef3c7; color: #92400e; }
.status-approved { background: #d1fae5; color: #065f46; }
.status-rejected { background: #fee2e2; color: #991b1b; }

.act-btn { border: none; padding: 6px 14px; border-radius: 4px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; margin-right: 4px; white-space: nowrap; }
.act-approve { background: #d1fae5; color: #065f46; }
.act-approve:hover { background: #a7f3d0; }
.act-reject { background: #fee2e2; color: #991b1b; }
.act-reject:hover { background: #fecaca; }
.act-view { background: #e0f2fe; color: #0369a1; }
.act-view:hover { background: #bae6fd; }

.empty-state { background: var(--white); border-radius: 10px; padding: 60px 24px; text-align: center; color: var(--ink-soft); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.empty-state i { font-size: 3rem; color: var(--gray-300); margin-bottom: 16px; }
.empty-state p { font-size: 0.95rem; }

.loading { text-align: center; padding: 60px; color: var(--ink-soft); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--black); color: var(--white); padding: 12px 22px; border-radius: 6px; font-size: 0.88rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000; }
.toast.show { opacity: 1; }
.toast.error { background: #b91c1c; }
.toast.success { background: #047857; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal-box { background: var(--white); border-radius: 10px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 28px; }
.modal-box h3 { font-size: 1.1rem; margin-bottom: 16px; }
.modal-box .detail-row { margin-bottom: 10px; font-size: 0.85rem; }
.modal-box .detail-label { color: var(--ink-soft); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }
.modal-box .close-btn { float: right; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--ink-soft); }

@media (max-width: 768px) {
  .stats-row { grid-template-columns: 1fr; }
  table { font-size: 0.78rem; }
  th, td { padding: 8px 6px; }
}
</style>
</head>

    <a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i> <span data-en="Dashboard" data-ko="대시보드">Dashboard</span></a>

<div class="admin" id="adminContent" style="display:none;">

  <div class="page-head">
    <div>
      <h1>BIM / CAD / Catalog Requests</h1>
      <div class="sub">전문가가 신청한 BIM/CAD/카탈로그 데이터 요청입니다. 승인하면 7일간 유효한 다운로드 링크가 신청자에게, 리드 알림이 해당 브랜드에게 자동 발송됩니다.</div>
    </div>
    <div class="head-actions">
      <select class="filter-select" id="statusFilter">
        <option value="pending" selected>Pending</option>
        <option value="approved">Approved</option>

      </select>
      <button class="btn secondary" id="refreshBtn"><i class="fas fa-sync"></i> Refresh</button>

  <div class="stats-row">
    <div class="stat-card pending"><div class="number" id="statPending">0</div><div class="label">Pending</div></div>
    <div class="stat-card approved"><div class="number" id="statApproved">0</div><div class="label">Approved</div></div>
    <div class="stat-card rejected"><div class="number" id="statRejected">0</div><div class="label">Rejected</div></div>
  </div>

  <div id="contentArea">
    <div class="loading"><i class="fas fa-spinner fa-spin" style="font-size:1.5rem;color:#7a5c32;"></i><p style="margin-top:12px;">Loading requests...</p></div>
  </div>

</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <button class="close-btn" onclick="closeDetailModal()">&times;</button>
    <div id="detailModalContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../firebase-config.js"></script>
<script src="js/admin-core.js?v=20261102a"></script>
<script src="js/admin-nav.js?v=20261102a"></script>
<script src="../lang.js?v=20260630"></script>
<script>
// firebase-config.js 가 ADMIN_EMAILS, isAdmin(), auth, db 제공 — 재선언 금지
let allDocs = [];
let currentFilter = 'pending';

auth.onAuthStateChanged(function(user) {
  if (!user) {
    location.replace('../auth/login.html?next=/admin/bim-requests.html');
    return;
  }
  if (!isAdmin(user.email)) {
    document.body.innerHTML = '<div style="text-align:center;padding:80px 24px;font-family:Inter,sans-serif;"><h1 style="font-size:1.5rem;margin-bottom:12px;">Access Denied</h1><p style="color:#6b6459;">This page is restricted to ARCHINODE editorial team.</p><p style="margin-top:18px;"><a href="/" style="color:#7a5c32;">Return to homepage</a></p></div>';
    return;
  }
  document.getElementById('adminEmail').textContent = user.email;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('adminContent').style.display = 'block';
  loadRequests();
});

document.getElementById('logoutBtn').addEventListener('click', function() {
  auth.signOut().then(function() { location.replace('../auth/login.html'); });
});

document.getElementById('refreshBtn').addEventListener('click', loadRequests);
document.getElementById('csvBtn').addEventListener('click', downloadCSV);
document.getElementById('statusFilter').addEventListener('change', function() {
  currentFilter = this.value;
  render();
});

function loadRequests() {
  const container = document.getElementById('contentArea');
  container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin" style="font-size:1.5rem;color:#7a5c32;"></i><p style="margin-top:12px;">Loading requests...</p></div>';

  db.collection('bim-requests').orderBy('createdAt', 'desc').limit(500).get()
    .then(function(snap) {
      allDocs = [];
      snap.forEach(function(doc) {
        allDocs.push(Object.assign({ id: doc.id }, doc.data()));
      });
      updateStats();
      render();
    })
    .catch(function(err) {
      console.error(err);
      container.innerHTML = '<div class="empty-state"><i class="fas fa-circle-exclamation"></i><p>Failed to load: ' + escapeHtml(err.message) + '</p></div>';
    });
}

function updateStats() {
  var counts = { pending: 0, approved: 0, rejected: 0 };
  allDocs.forEach(function(d) { if (counts[d.status] !== undefined) counts[d.status]++; });
  document.getElementById('statPending').textContent = counts.pending;
  document.getElementById('statApproved').textContent = counts.approved;
  document.getElementById('statRejected').textContent = counts.rejected;
}

function render() {
  var container = document.getElementById('contentArea');
  var list = currentFilter === 'all' ? allDocs : allDocs.filter(function(d) { return d.status === currentFilter; });

  if (list.length === 0) {
    container.innerHTML = '<div class="empty-state"><i class="fas fa-cube"></i><p>표시할 요청이 없습니다.</p></div>';
    return;
  }

  var html = '<div class="section-card"><table><thead><tr>'
    + '<th>Requester</th><th>Product</th><th>File</th><th>Project</th><th>Status</th><th>Date</th><th style="text-align:right;">Actions</th>'
    + '</tr></thead><tbody>';
  list.forEach(function(d) {
    var statusClass = 'status-' + (d.status || 'pending');
    var fileLabel = { catalog: 'PDF Catalog', bim: 'BIM File', model3d: '3D Model' }[d.fileType] || (d.fileType || '-');
    html += '<tr>'
      + '<td><strong>' + escapeHtml(d.name || '-') + '</strong><br><small style="color:#6b6459;">' + escapeHtml(d.company || '-') + '</small><br><a href="mailto:' + escapeAttr(d.email || '') + '">' + escapeHtml(d.email || '-') + '</a></td>'
      + '<td>' + escapeHtml(d.productName || '-') + '<br><small style="color:#6b6459;">' + escapeHtml(d.brandName || '-') + '</small></td>'
      + '<td>' + escapeHtml(fileLabel) + '</td>'
      + '<td>' + escapeHtml(d.projectName || '-') + '<br><small style="color:#6b6459;">' + escapeHtml(d.projectType || '-') + '</small></td>'
      + '<td><span class="status-badge ' + statusClass + '">' + escapeHtml(d.status || 'pending') + '</span></td>'
      + '<td>' + formatDate(d.createdAt) + '</td>'
      + '<td style="text-align:right;">'
      + '<button class="act-btn act-view" data-action="view" data-id="' + escapeAttr(d.id) + '">View</button>'
      + (d.status === 'pending' ? '<button class="act-btn act-approve" data-action="approve" data-id="' + escapeAttr(d.id) + '">Approve</button><button class="act-btn act-reject" data-action="reject" data-id="' + escapeAttr(d.id) + '">Reject</button>' : '')
      + '</td>'
      + '</tr>';
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

document.getElementById('contentArea').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var id = btn.getAttribute('data-id');
  var action = btn.getAttribute('data-action');
  if (action === 'view') viewRequest(id);
  else if (action === 'approve') approveRequest(id);
  else if (action === 'reject') rejectRequest(id);
});

function findDoc(id) { return allDocs.find(function(d) { return d.id === id; }); }

function viewRequest(id) {
  var d = findDoc(id);
  if (!d) return;
  var fileLabel = { catalog: 'PDF Catalog', bim: 'BIM File', model3d: '3D Model' }[d.fileType] || (d.fileType || '-');
  document.getElementById('detailModalContent').innerHTML =
    '<h3>' + escapeHtml(d.name || '-') + ' — ' + escapeHtml(d.company || '-') + '</h3>'
    + '<div class="detail-row"><div class="detail-label">Title</div>' + escapeHtml(d.title || '-') + '</div>'
    + '<div class="detail-row"><div class="detail-label">Email</div>' + escapeHtml(d.email || '-') + '</div>'
    + '<div class="detail-row"><div class="detail-label">Phone</div>' + escapeHtml(d.phone || '-') + '</div>'
    + '<div class="detail-row"><div class="detail-label">Product / Brand</div>' + escapeHtml(d.productName || '-') + ' / ' + escapeHtml(d.brandName || '-') + '</div>'
    + '<div class="detail-row"><div class="detail-label">File Requested</div>' + escapeHtml(fileLabel) + '</div>'
    + '<div class="detail-row"><div class="detail-label">Project Name</div>' + escapeHtml(d.projectName || '-') + '</div>'
    + '<div class="detail-row"><div class="detail-label">Project Type</div>' + escapeHtml(d.projectType || '-') + '</div>'
    + '<div class="detail-row"><div class="detail-label">Timeline</div>' + escapeHtml(d.projectTimeline || '-') + '</div>'
    + '<div class="detail-row"><div class="detail-label">Scale</div>' + escapeHtml(d.projectScale || '-') + '</div>'
    + '<div class="detail-row"><div class="detail-label">Status</div><span class="status-badge status-' + escapeHtml(d.status || 'pending') + '">' + escapeHtml(d.status || 'pending') + '</span></div>'
    + '<div class="detail-row"><div class="detail-label">Requested</div>' + formatDate(d.createdAt) + '</div>'
    + (d.expiresAt ? '<div class="detail-row"><div class="detail-label">Link Expires</div>' + formatDate(d.expiresAt) + '</div>' : '');
  document.getElementById('detailModal').classList.add('active');
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('active');
}

function rejectRequest(id) {
  if (!confirm('이 요청을 반려하시겠습니까?')) return;
  db.collection('bim-requests').doc(id).update({
    status: 'rejected',
    reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
    reviewedBy: auth.currentUser.email
  }).then(function() {
    showToast('반려 완료', 'success');
    loadRequests();
  }).catch(function(err) {
    console.error(err);
    showToast('실패: ' + err.message, 'error');
  });
}

// 승인: 제품 문서에서 해당 fileType의 실제 URL을 복사하고, expiresAt을 지금+7일로 계산한다.
// 승인 즉시 국내 신청자에게 다운로드 링크 메일, 유럽 브랜드에게 리드 통지 메일을 mail 컬렉션으로 발송한다.
async function approveRequest(id) {
  var d = findDoc(id);
  if (!d) return;
  if (!confirm(d.name + '님의 요청을 승인하시겠습니까? 7일간 유효한 다운로드 링크가 발송됩니다.')) return;

  try {
    var productSnap = await db.collection('products').doc(d.productId).get();
    if (!productSnap.exists) { showToast('제품 문서를 찾을 수 없습니다.', 'error'); return; }
    var product = productSnap.data();
    var fieldMap = { catalog: 'catalogPdf', bim: 'bimFile', model3d: 'model3d' };
    var fileUrl = product[fieldMap[d.fileType]] || '';
    if (!fileUrl) { showToast('해당 파일 필드가 제품에 없습니다 (' + d.fileType + ').', 'error'); return; }

    var expiresAt = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);

    await db.collection('bim-requests').doc(id).update({
      status: 'approved',
      fileUrl: fileUrl,
      expiresAt: expiresAt,
      reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
      reviewedBy: auth.currentUser.email
    });

    var downloadLink = 'https://archinodekr.com/products/bim-download.html?req=' + id;

    // 국내 신청자용 다운로드 안내 메일
    await db.collection('mail').add({
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),  // 2026-11-02 QA: 발송 추적용 생성시각
      to: d.email,
      message: {
        subject: '[archinodekr] 요청하신 ' + (d.brandName || '') + ' - ' + (d.productName || '') + ' BIM 데이터가 승인되었습니다.',
        text: [
          '안녕하세요, ' + (d.name || '') + ' ' + (d.title || '') + '님.',
          '유럽 프리미엄 건축 플랫폼 archinodekr입니다.',
          '',
          '신청해주신 [' + (d.projectName || '') + '] 검토 목적의 ' + (d.brandName || '') + ' - ' + (d.productName || '') + ' 기술 데이터 다운로드가 승인되었습니다.',
          '',
          '■ 다운로드 링크: ' + downloadLink,
          '* 본 링크는 발송일로부터 7일간 유효합니다.',
          '',
          '■ 안내 및 주의사항:',
          '1. 본 데이터는 신청하신 프로젝트의 설계 검토 및 도면 반영(Spec-in) 목적으로만 사용 권한이 부여됩니다.',
          '2. 제3자 무단 배포, 상업적 복제, 역설계를 통한 유사 제품 제작은 저작권법 및 라이선스 규정에 의해 엄격히 금지됩니다.',
          '3. 향후 샘플 요청, 상세 기술 사양 협의, 또는 견적(RFQ)이 필요하신 경우 본 메일로 회신 주시면 유럽 제조사 본사와 직접 연결해 드립니다.',
          '',
          '감사합니다.',
          'archinodekr 운영팀 드림'
        ].join('\n')
      }
    });

    // 유럽 브랜드용 리드 통지 메일 (brands 컬렉션의 email 필드 사용)
    try {
      var brandSnap = await db.collection('brands').doc(d.brandId).get();
      var brandEmail = brandSnap.exists ? brandSnap.data().email : null;
      if (brandEmail) {
        await db.collection('mail').add({
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),  // 2026-11-02 QA: 발송 추적용 생성시각
          to: brandEmail,
          message: {
            subject: '[archinodekr Lead Alert] New BIM & Spec Request for ' + (d.productName || '') + ' in South Korea',
            text: [
              'Dear ' + (d.brandName || '') + ' team,',
              '',
              'We have received and approved a verified BIM data request for your product, ' + (d.productName || '') + ', from an architecture/design firm in South Korea.',
              '',
              'Here are the project & specifier details:',
              '- Specifier: ' + (d.name || '') + ', ' + (d.title || ''),
              '- Company: ' + (d.company || '') + ' (Verified professional)',
              '- Email: ' + (d.email || ''),
              '- Target Project: ' + (d.projectName || ''),
              '- Building Type / Scope: ' + (d.projectType || '') + ' / ' + (d.projectScale || ''),
              '',
              'This project is currently in the design & spec-in stage. We are monitoring this lead and will keep you updated if a sample request or formal Request for Quotation (RFQ) follows.',
              '',
              'Best regards,',
              'archinodekr Team'
            ].join('\n')
          }
        });
      }
    } catch (brandMailErr) { console.warn('Brand lead notification skipped:', brandMailErr); }

    if (typeof logAdmin === 'function') {
      logAdmin({ action: 'bim-request.approve', target: { col: 'bim-requests', id: id, label: d.name || '' }, from: 'pending', to: 'approved', note: d.productName || '' });
    }

    showToast('승인 완료 — 메일 발송됨', 'success');
    loadRequests();
  } catch (err) {
    console.error(err);
    showToast('승인 실패: ' + err.message, 'error');
  }
}

function downloadCSV() {
  if (allDocs.length === 0) { showToast('데이터가 없습니다.', 'error'); return; }
  var rows = [['Name', 'Company', 'Title', 'Email', 'Phone', 'Product', 'Brand', 'File Type', 'Project', 'Project Type', 'Status', 'Requested At']];
  allDocs.forEach(function(d) {
    rows.push([d.name||'', d.company||'', d.title||'', d.email||'', d.phone||'', d.productName||'', d.brandName||'', d.fileType||'', d.projectName||'', d.projectType||'', d.status||'', formatDate(d.createdAt)]);
  });
  var csv = rows.map(function(r) {
    return r.map(function(cell) {
      var s = String(cell == null ? '' : cell);
      if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(',');
  }).join('\n');
  var bom = '﻿';
  var blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var today = new Date();
  a.download = 'archinode-bim-requests-' + today.getFullYear() + pad(today.getMonth()+1) + pad(today.getDate()) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV 다운로드 완료 (' + allDocs.length + '건)', 'success');
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function escapeAttr(s) { return escapeHtml(s).replace(/\n/g, ' '); }
function formatDate(ts) {
  if (!ts) return '—';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function pad(n) { return n < 10 ? '0' + n : '' + n; }

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
</script>
