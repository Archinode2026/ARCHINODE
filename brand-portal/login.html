<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Log In | ARCHINODE</title>
<!--
  2026-11-03 A-152: 로그인 창 통합.
  브랜드용 로그인(brand-portal/login.html)과 회원용 로그인(auth/login.html)이
  화면은 같은데 로그인 후 분기만 달랐다. 이쪽은 brands 문서 여부를 보지 않고
  어드민이 아니면 무조건 브랜드 대시보드로 보내서, 일반 회원이 이 창으로
  로그인하면 자기 브랜드가 없는 대시보드로 떨어졌다.
  통합 로그인(auth/login.html)은 어드민·브랜드·회원 세 갈래를 모두 처리한다.
  기존 북마크와 외부 링크가 깨지지 않도록 이 파일은 남기고 그쪽으로 보낸다.
-->
<link rel="canonical" href="/auth/login.html">
<meta http-equiv="refresh" content="0; url=../auth/login.html">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
         background:#fafaf7; color:#666; font-size:0.9rem; }
  a { color:#7a5c32; }
</style>
</head>
<body>
<p>
  로그인 창으로 이동합니다…
  <a href="../auth/login.html">바로 가기</a>
</p>
<script>
  // meta refresh 보다 빠르게. replace 로 뒤로가기 루프를 막는다.
  window.location.replace('../auth/login.html' + window.location.search + window.location.hash);
</script>
</body>
</html>
