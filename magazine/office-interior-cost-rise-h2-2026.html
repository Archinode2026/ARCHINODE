    <h1 data-en="Office Interiors Get Pricier in the Second Half" data-ko="사무실 인테리어, 하반기엔 더 비싸진다">사무실 인테리어, 하반기엔 더 비싸진다</h1>
    <p class="subtitle" data-en="90% of contractors expect price hikes within six months — tariffs and labor push costs up at once." data-ko="시공사 90%가 6개월 내 단가 인상을 예측 — 관세와 인건비가 동시에 밀어올린다.">시공사 90%가 6개월 내 단가 인상을 예측 — 관세와 인건비가 동시에 밀어올린다.</p>
    <div class="meta">2026-07-10 <span>&middot;</span> ARCHINODE Editorial</div>
</section>
<article class="article-body">
<p class="lead" data-en="July 2026. If you are planning an office fit-out for the second half, the quote you got in spring may no longer hold. In a recent industry survey, 90% of contractors said their own prices will edge up over the next six months. Two forces are pushing at once — rising labor costs and tariff risk. This is not a temporary spike but a structural cost floor being reset." data-ko="2026년 7월, 하반기 사무실 공사를 계획 중이라면 봄에 받은 견적이 그대로 유지되지 않을 수 있다. 최근 업계 설문에서 시공사의 90%가 향후 6개월 내 자사 단가가 소폭 오를 것이라고 답했다. 밀어올리는 힘은 두 가지다 — 인건비 상승과 관세 리스크. 일시적 급등이 아니라 비용의 밑바닥 자체가 다시 그어지고 있다.">2026년 7월, 하반기 사무실 공사를 계획 중이라면 봄에 받은 견적이 그대로 유지되지 않을 수 있다. 최근 업계 설문에서 시공사의 90%가 향후 6개월 내 자사 단가가 소폭 오를 것이라고 답했다. 밀어올리는 힘은 두 가지다 — 인건비 상승과 관세 리스크. 일시적 급등이 아니라 비용의 밑바닥 자체가 다시 그어지고 있다.</p>
<h2 data-en="90% Say Prices Will Rise — The Signal Behind the Number" data-ko="90%가 오른다고 말한다 — 숫자 뒤의 신호">90%가 오른다고 말한다 — 숫자 뒤의 신호</h2>
<p data-en="A single figure carries the weight: nine out of ten contractors expect to raise prices. When nearly the entire supply side moves one way, it stops being a negotiating posture and becomes a market baseline. On the cost side, about 36% of respondents said tariff increases will nudge supplier and trade prices up, while more than half expect supply-chain prices to stay broadly neutral. Read together, the message is clear — material costs may hold, but labor and installation are where the increase lands." data-ko="하나의 수치가 무게를 갖는다. 열 곳 중 아홉 곳의 시공사가 가격 인상을 예상한다. 공급 측 전체가 한 방향으로 움직이면 그건 협상 자세가 아니라 시장의 기준선이 된다. 비용 측면에서는 응답 기업의 약 36%가 관세 인상이 공급업체·무역 가격을 소폭 올릴 것이라 보았고, 절반 이상은 공급망 가격이 대체로 중립 수준을 유지할 것으로 내다봤다. 합쳐 읽으면 메시지는 분명하다 — 자재비는 버텨도, 인건비와 시공비에서 오름이 터진다.">하나의 수치가 무게를 갖는다. 열 곳 중 아홉 곳의 시공사가 가격 인상을 예상한다. 공급 측 전체가 한 방향으로 움직이면 그건 협상 자세가 아니라 시장의 기준선이 된다. 비용 측면에서는 응답 기업의 약 36%가 관세 인상이 공급업체·무역 가격을 소폭 올릴 것이라 보았고, 절반 이상은 공급망 가격이 대체로 중립 수준을 유지할 것으로 내다봤다. 합쳐 읽으면 메시지는 분명하다 — 자재비는 버텨도, 인건비와 시공비에서 오름이 터진다.</p>
<figure><img loading="lazy" src="../assets/magazine/placeholders/construction.svg" alt="사무실 인테리어 공사 현장"><figcaption data-en="Material costs may hold, but labor and installation drive the increase (Image: Unsplash)" data-ko="자재비는 버텨도 인건비·시공비가 상승을 이끈다 (이미지: Unsplash)">자재비는 버텨도 인건비·시공비가 상승을 이끈다 (이미지: Unsplash)</figcaption></figure>
<p data-en="What do the numbers look like on the ground? For 2026, a basic office fit-out — flooring, painting, lighting — runs roughly 1.2 to 1.6 million won per pyeong. A mid-tier scope adding partitions, LED, and meeting rooms lands at 1.6 to 2.0 million won, and premium work with custom furniture and CI branding exceeds 2.0 million won per pyeong. For a 100-pyeong office, the gap between basic and premium already spans well over 100 million won — and every band is drifting upward into the second half." data-ko="현장의 숫자는 어떤가. 2026년 기준 기본형 사무실 공사(바닥재·도장·조명)는 평당 약 120만~160만 원 수준이다. 파티션·LED·회의실을 더한 중급형은 160만~200만 원, 맞춤가구와 CI 브랜딩을 포함한 프리미엄은 평당 200만 원을 넘는다. 100평 사무실이라면 기본형과 프리미엄의 간격이 이미 1억 원을 훌쩍 넘기고, 하반기로 갈수록 모든 구간이 위로 밀리고 있다.">현장의 숫자는 어떤가. 2026년 기준 기본형 사무실 공사(바닥재·도장·조명)는 평당 약 120만~160만 원 수준이다. 파티션·LED·회의실을 더한 중급형은 160만~200만 원, 맞춤가구와 CI 브랜딩을 포함한 프리미엄은 평당 200만 원을 넘는다. 100평 사무실이라면 기본형과 프리미엄의 간격이 이미 1억 원을 훌쩍 넘기고, 하반기로 갈수록 모든 구간이 위로 밀리고 있다.</p>
<blockquote data-en="&quot;Nine out of ten contractors raising prices is no longer a posture — it is the new baseline. Budget for the ceiling, not the quote you got in spring.&quot;" data-ko="&quot;시공사 열 중 아홉이 가격을 올린다면 그건 더 이상 자세가 아니라 새 기준선이다. 봄에 받은 견적이 아니라 천장을 기준으로 예산을 잡아라.&quot;">"시공사 열 중 아홉이 가격을 올린다면 그건 더 이상 자세가 아니라 새 기준선이다. 봄에 받은 견적이 아니라 천장을 기준으로 예산을 잡아라."</blockquote>
<h2 data-en="How to Budget When the Floor Keeps Moving" data-ko="밑바닥이 움직일 때 예산을 짜는 법">밑바닥이 움직일 때 예산을 짜는 법</h2>
<p data-en="For a client commissioning a fit-out, the practical defense is a contract, not a hope. Industry guidance is blunt — build the budget assuming standard unit prices will move up, and write a price-adjustment clause into the contract so a mid-project increase does not become a dispute. Locking material quantities early, ordering long-lead imported items before tariff dates, and fixing the labor scope in writing all shift risk off the client. Five minutes on a price-escalation clause today can save weeks of renegotiation later." data-ko="공사를 맡기는 발주사 입장에서 현실적인 방어책은 기대가 아니라 계약서다. 업계 권고는 명확하다 — 표준 단가가 상향될 것을 전제로 예산을 잡고, 공사 중 인상이 분쟁으로 번지지 않도록 가격조정 조항을 계약에 명시하라는 것이다. 자재 물량을 일찍 확정하고, 리드타임이 긴 수입 품목은 관세 적용일 전에 발주하며, 인건 범위를 문서로 고정하면 리스크는 발주사에서 벗어난다. 오늘 가격조정 조항에 5분을 쓰면 나중에 몇 주의 재협상을 아낀다.">공사를 맡기는 발주사 입장에서 현실적인 방어책은 기대가 아니라 계약서다. 업계 권고는 명확하다 — 표준 단가가 상향될 것을 전제로 예산을 잡고, 공사 중 인상이 분쟁으로 번지지 않도록 가격조정 조항을 계약에 명시하라는 것이다. 자재 물량을 일찍 확정하고, 리드타임이 긴 수입 품목은 관세 적용일 전에 발주하며, 인건 범위를 문서로 고정하면 리스크는 발주사에서 벗어난다. 오늘 가격조정 조항에 5분을 쓰면 나중에 몇 주의 재협상을 아낀다.</p>
<p data-en="There is a design-side lever too. When unit prices rise across the board, the smartest savings come from scope discipline, not cheaper materials. Cutting a premium finish by 10% saves little; deferring one non-essential zone — a rarely used lounge, an oversized reception — removes an entire trade package. In a rising-cost half-year, editing the program is worth more than shaving the spec." data-ko="설계 측의 지렛대도 있다. 단가가 전반적으로 오를 때 가장 현명한 절감은 자재를 싼 것으로 바꾸는 게 아니라 범위를 기율 있게 관리하는 데서 나온다. 프리미엄 마감을 10% 낮춰봐야 절감은 작지만, 잘 안 쓰는 라운지나 과대한 리셉션 같은 비필수 존 하나를 미루면 공종 패키지 하나가 통째로 빠진다. 비용이 오르는 반기엔 스펙을 깎는 것보다 프로그램을 편집하는 게 더 값지다.">설계 측의 지렛대도 있다. 단가가 전반적으로 오를 때 가장 현명한 절감은 자재를 싼 것으로 바꾸는 게 아니라 범위를 기율 있게 관리하는 데서 나온다. 프리미엄 마감을 10% 낮춰봐야 절감은 작지만, 잘 안 쓰는 라운지나 과대한 리셉션 같은 비필수 존 하나를 미루면 공종 패키지 하나가 통째로 빠진다. 비용이 오르는 반기엔 스펙을 깎는 것보다 프로그램을 편집하는 게 더 값지다.</p>
<div class="editor-note">
<h3 data-en="Editor&apos;s Note" data-ko="편집장 코멘트">편집장 코멘트</h3>
<p data-en="For ARCHINODE, a rising-cost cycle is not only a headwind — it reshapes buying behavior. When labor becomes the dominant cost driver, materials that cut installation time (pre-finished panels, click-lock flooring, modular partitions) gain a pricing advantage that raw material specs cannot match. Global brands entering Korea should lead with total installed cost, not sticker price. In a market where 90% of contractors are quoting increases, the material that saves a day of labor sells itself." data-ko="ARCHINODE 입장에서 비용 상승기는 역풍만이 아니다 — 구매 행동 자체를 바꾼다. 인건비가 비용의 주역이 되면 시공 시간을 줄이는 자재(선시공 패널, 클릭식 바닥재, 모듈형 파티션)가 원자재 스펙으로는 따라올 수 없는 가격 우위를 얻는다. 한국에 진입하는 글로벌 브랜드는 정가가 아니라 &apos;설치까지 포함한 총비용&apos;으로 승부해야 한다. 시공사 90%가 인상을 부르는 시장에서, 하루치 인건을 줄이는 자재는 스스로 팔린다.">ARCHINODE 입장에서 비용 상승기는 역풍만이 아니다 — 구매 행동 자체를 바꾼다. 인건비가 비용의 주역이 되면 시공 시간을 줄이는 자재(선시공 패널, 클릭식 바닥재, 모듈형 파티션)가 원자재 스펙으로는 따라올 수 없는 가격 우위를 얻는다. 한국에 진입하는 글로벌 브랜드는 정가가 아니라 '설치까지 포함한 총비용'으로 승부해야 한다. 시공사 90%가 인상을 부르는 시장에서, 하루치 인건을 줄이는 자재는 스스로 팔린다.</p>
