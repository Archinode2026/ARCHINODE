<section class="article-hero">
    <span class="tag" data-en="Safety" data-ko="안전">안전</span>
    <h1 data-en="How EV Fires Rewired the Underground Garage" data-ko="전기차 화재가 바꾼 지하주차장">전기차 화재가 바꾼 지하주차장</h1>
    <p class="subtitle" data-en="The 2026 wet-sprinkler mandate — why the pre-action system was pushed aside." data-ko="2026 습식 스프링클러 의무화 — 준비작동식은 왜 밀려났나.">2026 습식 스프링클러 의무화 — 준비작동식은 왜 밀려났나.</p>
    <div class="meta">2026-07-20 <span>&middot;</span> ARCHINODE Editorial</div>
</section>
<article class="article-body">
<p class="lead" data-en="From 2026, the fire-safety rules for underground parking garages have been tightened significantly, and the change is being driven by one thing: electric-vehicle fires. Where garages that admit EVs previously relied on pre-action sprinkler systems, the strengthened standard pushes toward wet-pipe sprinklers — the type that holds water in the pipes and discharges the instant a head opens. It sounds like a small technical swap. On site, and on your maintenance bill, it is anything but." data-ko="2026년부터 지하주차장 소방 기준이 대폭 강화됐고, 그 변화를 이끄는 건 하나다. 전기차 화재다. 전기차 주차가 가능한 지하주차장이 기존에는 준비작동식 스프링클러에 의존했다면, 강화된 기준은 습식 스프링클러 — 배관에 물을 채워 두었다가 헤드가 열리는 즉시 물을 뿌리는 방식 — 쪽으로 밀고 간다. 사소한 기술 교체처럼 들린다. 하지만 현장에서, 그리고 관리비 고지서에서 그것은 전혀 사소하지 않다.">2026년부터 지하주차장 소방 기준이 대폭 강화됐고, 그 변화를 이끄는 건 하나다. 전기차 화재다. 전기차 주차가 가능한 지하주차장이 기존에는 준비작동식 스프링클러에 의존했다면, 강화된 기준은 습식 스프링클러 — 배관에 물을 채워 두었다가 헤드가 열리는 즉시 물을 뿌리는 방식 — 쪽으로 밀고 간다. 사소한 기술 교체처럼 들린다. 하지만 현장에서, 그리고 관리비 고지서에서 그것은 전혀 사소하지 않다.</p>
<h2 data-en="From Pre-Action to Wet: What Actually Changes" data-ko="준비작동식에서 습식으로, 무엇이 달라지나">준비작동식에서 습식으로, 무엇이 달라지나</h2>
<p data-en="The two systems differ in one decisive way: where the water waits. A pre-action system keeps the pipes dry and only fills them after a detector confirms a fire, then discharges — a deliberate delay designed to prevent accidental water damage in spaces like parking decks. A wet system keeps the pipes charged at all times, so when a sprinkler head opens, water hits immediately with no detection lag. For an ordinary fire, the pre-action delay is a tolerable trade. For an EV battery fire, it is a problem: a lithium-ion pack in thermal runaway escalates in seconds and burns far hotter and longer than a conventional car fire, so every second of delay lets the fire establish. That is the safety logic behind the shift — get water on the fire faster." data-ko="두 방식은 한 가지 결정적 지점에서 갈린다. 물이 어디서 대기하는가다. 준비작동식은 배관을 비워 두었다가 감지기가 화재를 확인한 뒤에야 물을 채우고 방수한다. 주차장 같은 공간에서 오작동 수손해를 막으려는 의도적 지연이다. 습식은 배관에 항상 물을 채워 두므로 스프링클러 헤드가 열리면 감지 지연 없이 즉시 물이 나온다. 일반 화재라면 준비작동식의 지연은 감내할 만한 거래다. 그러나 전기차 배터리 화재에서는 문제가 된다. 열폭주에 빠진 리튬이온 팩은 수초 만에 격화되고 일반 차량 화재보다 훨씬 뜨겁고 오래 타므로, 지연되는 1초마다 불이 자리를 잡는다. 이번 전환의 안전 논리가 여기 있다. 더 빨리 물을 뿌린다는 것.">두 방식은 한 가지 결정적 지점에서 갈린다. 물이 어디서 대기하는가다. 준비작동식은 배관을 비워 두었다가 감지기가 화재를 확인한 뒤에야 물을 채우고 방수한다. 주차장 같은 공간에서 오작동 수손해를 막으려는 의도적 지연이다. 습식은 배관에 항상 물을 채워 두므로 스프링클러 헤드가 열리면 감지 지연 없이 즉시 물이 나온다. 일반 화재라면 준비작동식의 지연은 감내할 만한 거래다. 그러나 전기차 배터리 화재에서는 문제가 된다. 열폭주에 빠진 리튬이온 팩은 수초 만에 격화되고 일반 차량 화재보다 훨씬 뜨겁고 오래 타므로, 지연되는 1초마다 불이 자리를 잡는다. 이번 전환의 안전 논리가 여기 있다. 더 빨리 물을 뿌린다는 것.</p>
<p data-en="Worth being precise about the limits, too. Wet sprinklers cool the surroundings and slow fire spread to adjacent cars; they do not reliably 'extinguish' a battery pack that is generating its own oxygen internally. Full EV-fire response still leans on suppression tactics like water immersion or specialized coverings. So the mandate is best understood as raising the floor — faster cooling, less spread — rather than solving battery fires outright. It is a meaningful improvement, not a magic bullet." data-ko="한계도 정확히 짚을 필요가 있다. 습식 스프링클러는 주변을 냉각하고 옆 차량으로의 확산을 늦춘다. 내부에서 스스로 산소를 만들어내는 배터리 팩을 확실히 '소화'하지는 못한다. 완전한 전기차 화재 대응은 여전히 수조 침수나 전용 덮개 같은 진압 전술에 의존한다. 그러므로 이번 의무화는 배터리 화재를 통째로 해결한다기보다 바닥을 높이는 것 — 더 빠른 냉각, 더 적은 확산 — 으로 이해하는 게 맞다. 의미 있는 개선이지 만능 해법은 아니다.">한계도 정확히 짚을 필요가 있다. 습식 스프링클러는 주변을 냉각하고 옆 차량으로의 확산을 늦춘다. 내부에서 스스로 산소를 만들어내는 배터리 팩을 확실히 '소화'하지는 못한다. 완전한 전기차 화재 대응은 여전히 수조 침수나 전용 덮개 같은 진압 전술에 의존한다. 그러므로 이번 의무화는 배터리 화재를 통째로 해결한다기보다 바닥을 높이는 것 — 더 빠른 냉각, 더 적은 확산 — 으로 이해하는 게 맞다. 의미 있는 개선이지 만능 해법은 아니다.</p>
<figure><img loading="lazy" src="../assets/magazine/placeholders/construction.svg" alt="지하주차장 스프링클러 배관 이미지"><figcaption data-en="Wet pipes discharge with no detection lag — decisive against battery fires that escalate in seconds." data-ko="습식 배관은 감지 지연 없이 방수한다 — 수초 만에 격화되는 배터리 화재에 결정적이다.">습식 배관은 감지 지연 없이 방수한다 — 수초 만에 격화되는 배터리 화재에 결정적이다.</figcaption></figure>
<h2 data-en="Freezing and Upkeep: The Field's Real Worry" data-ko="동파와 유지보수, 현장의 진짜 고민">동파와 유지보수, 현장의 진짜 고민</h2>
<p data-en="Ask anyone who installs and maintains these systems why pre-action was used in garages in the first place, and the answer is one word: freezing. A wet system has water sitting in every pipe, and an underground garage in a Korean winter is an unheated space with ramps open to the outside air near the entrances. Water in a pipe that drops below freezing expands, splits the pipe, and you discover it the day it thaws and floods the deck. That is not a hypothetical — it is the classic wet-system failure. So the mandate does not end at 'install wet sprinklers.' It quietly imports a whole set of obligations: freeze protection at exposed sections, heat tracing or insulation where cold air reaches, and diligent seasonal inspection. For new construction this is designed in. For the existing building stock, retrofitting wet pipes into a garage that was built for a dry system is the expensive, disruptive part." data-ko="이 시스템을 시공하고 유지보수하는 사람에게 애초에 주차장에 왜 준비작동식을 썼냐고 물으면 답은 한 단어다. 동파다. 습식은 모든 배관에 물이 들어 있고, 한국의 겨울철 지하주차장은 난방이 없는 공간이며 입구 근처 램프는 외기에 열려 있다. 어는점 아래로 떨어진 배관 속 물은 팽창해 배관을 터뜨리고, 녹는 날 바닥이 물바다가 되어서야 발견된다. 가정이 아니라 습식의 전형적 실패다. 그래서 의무화는 '습식 스프링클러를 설치하라'로 끝나지 않는다. 한 묶음의 의무를 조용히 함께 들여온다. 노출부 동파 방지, 외기가 닿는 구간의 열선(히팅 케이블)이나 보온, 그리고 성실한 계절별 점검이다. 신축은 이를 설계에 반영한다. 문제는 기존 건물이다. 건식용으로 지어진 주차장에 습식 배관을 개조해 넣는 것이 비싸고 번거로운 부분이다.">이 시스템을 시공하고 유지보수하는 사람에게 애초에 주차장에 왜 준비작동식을 썼냐고 물으면 답은 한 단어다. 동파다. 습식은 모든 배관에 물이 들어 있고, 한국의 겨울철 지하주차장은 난방이 없는 공간이며 입구 근처 램프는 외기에 열려 있다. 어는점 아래로 떨어진 배관 속 물은 팽창해 배관을 터뜨리고, 녹는 날 바닥이 물바다가 되어서야 발견된다. 가정이 아니라 습식의 전형적 실패다. 그래서 의무화는 '습식 스프링클러를 설치하라'로 끝나지 않는다. 한 묶음의 의무를 조용히 함께 들여온다. 노출부 동파 방지, 외기가 닿는 구간의 열선(히팅 케이블)이나 보온, 그리고 성실한 계절별 점검이다. 신축은 이를 설계에 반영한다. 문제는 기존 건물이다. 건식용으로 지어진 주차장에 습식 배관을 개조해 넣는 것이 비싸고 번거로운 부분이다.</p>
<blockquote data-en="&quot;Switching to wet is the easy sentence to write. The hard part is everything it drags in — freeze protection, heat tracing, seasonal checks. On an existing building, that is where the real cost hides.&quot;" data-ko="&quot;습식으로 바꾼다는 건 쓰기 쉬운 문장이다. 어려운 건 그게 함께 끌고 오는 것들 — 동파 방지, 열선, 계절 점검이다. 기존 건물에서 진짜 비용은 거기 숨어 있다.&quot;">"습식으로 바꾼다는 건 쓰기 쉬운 문장이다. 어려운 건 그게 함께 끌고 오는 것들 — 동파 방지, 열선, 계절 점검이다. 기존 건물에서 진짜 비용은 거기 숨어 있다."</blockquote>
<h2 data-en="Maintenance Fees and Safety: What Residents Should Track" data-ko="관리비와 안전, 입주민이 챙길 것">관리비와 안전, 입주민이 챙길 것</h2>
<p data-en="For someone living in an apartment, the practical questions are simple. If you are buying or moving into new construction, the wet system and its freeze protection are part of the building from day one — the cost is baked into the price, and the benefit is a garage that reacts faster to an EV fire. If you live in an existing complex, the relevant question is whether, when and how the building will be brought up to the new standard, because retrofitting a garage sprinkler system is a common-area capital cost that ultimately shows up in long-term repair reserves or a special assessment. It is fair to ask the management office two things: what the building's current garage sprinkler type is, and whether any upgrade is planned or required on its timeline." data-ko="아파트에 사는 사람에게 실질적인 질문은 단순하다. 신축을 사거나 입주한다면 습식 시스템과 동파 방지는 첫날부터 건물의 일부다. 비용은 분양가에 녹아 있고, 그 대가로 전기차 화재에 더 빨리 반응하는 주차장을 얻는다. 기존 단지에 산다면, 관련 질문은 건물이 새 기준에 맞춰 언제 어떻게 개선되는가다. 주차장 스프링클러 개조는 공용부 자본적 지출이라 결국 장기수선충당금이나 별도 부과금으로 나타나기 때문이다. 관리사무소에 두 가지를 물어볼 만하다. 우리 건물 주차장 스프링클러가 지금 어떤 방식인지, 그리고 정해진 일정상 개선 계획이나 의무가 있는지.">아파트에 사는 사람에게 실질적인 질문은 단순하다. 신축을 사거나 입주한다면 습식 시스템과 동파 방지는 첫날부터 건물의 일부다. 비용은 분양가에 녹아 있고, 그 대가로 전기차 화재에 더 빨리 반응하는 주차장을 얻는다. 기존 단지에 산다면, 관련 질문은 건물이 새 기준에 맞춰 언제 어떻게 개선되는가다. 주차장 스프링클러 개조는 공용부 자본적 지출이라 결국 장기수선충당금이나 별도 부과금으로 나타나기 때문이다. 관리사무소에 두 가지를 물어볼 만하다. 우리 건물 주차장 스프링클러가 지금 어떤 방식인지, 그리고 정해진 일정상 개선 계획이나 의무가 있는지.</p>
<p data-en="The bigger point for residents is that this is the pattern to expect from now on: as EV adoption climbs, the building code keeps catching up to a risk that did not exist when most garages were designed. Charger placement, fire-rated separation, cooling response — these will keep tightening. A garage that meets the 2026 standard is not the end state; it is the current floor. Reading a maintenance-fee line item about 'fire system upgrade' in that light makes it easier to see it as insurance rather than a nuisance." data-ko="입주민에게 더 큰 요점은 이것이 앞으로 예상해야 할 패턴이라는 것이다. 전기차 보급이 늘수록 건축·소방 기준은 대부분의 주차장이 설계될 때는 존재하지 않던 위험을 계속 따라잡는다. 충전기 배치, 내화 구획, 냉각 대응 — 이런 것들이 계속 강화될 것이다. 2026년 기준을 만족하는 주차장은 최종 상태가 아니라 현재의 바닥이다. 관리비 명세의 '소방 시스템 개선' 항목을 그런 눈으로 읽으면, 성가신 비용이 아니라 보험으로 보기가 한결 쉬워진다.">입주민에게 더 큰 요점은 이것이 앞으로 예상해야 할 패턴이라는 것이다. 전기차 보급이 늘수록 건축·소방 기준은 대부분의 주차장이 설계될 때는 존재하지 않던 위험을 계속 따라잡는다. 충전기 배치, 내화 구획, 냉각 대응 — 이런 것들이 계속 강화될 것이다. 2026년 기준을 만족하는 주차장은 최종 상태가 아니라 현재의 바닥이다. 관리비 명세의 '소방 시스템 개선' 항목을 그런 눈으로 읽으면, 성가신 비용이 아니라 보험으로 보기가 한결 쉬워진다.</p>
<div class="editor-note">
<h3 data-en="Editor&apos;s Note" data-ko="편집장 코멘트">편집장 코멘트</h3>
<p data-en="For ARCHINODE, the sprinkler mandate is a reminder that EV adoption is quietly rewriting the building code — and each rewrite opens a materials-and-systems market. Wet-pipe conversion drags in freeze protection, heat tracing, insulation and fire-rated separation, most of it landing on the enormous existing building stock rather than new builds. Brands in fire-suppression, thermal and safety systems should read regulatory tightening as a demand signal, and position for the retrofit wave rather than the comparatively small new-construction slice. The code will keep moving in one direction; the supply chain that anticipates it wins." data-ko="ARCHINODE 입장에서 이번 스프링클러 의무화는 전기차 보급이 건축·소방 기준을 조용히 다시 쓰고 있다는 신호이며, 그 개정마다 자재·시스템 시장이 열린다는 리마인더다. 습식 전환은 동파 방지·열선·보온·내화 구획을 함께 끌고 오고, 그 대부분은 신축이 아니라 방대한 기존 건물 재고에 떨어진다. 소방·열·안전 시스템 브랜드는 규제 강화를 수요 신호로 읽고, 상대적으로 작은 신축 몫이 아니라 개조(리트로핏) 물결에 포지셔닝해야 한다. 기준은 한 방향으로 계속 움직인다. 그것을 앞서 읽는 공급망이 이긴다.">ARCHINODE 입장에서 이번 스프링클러 의무화는 전기차 보급이 건축·소방 기준을 조용히 다시 쓰고 있다는 신호이며, 그 개정마다 자재·시스템 시장이 열린다는 리마인더다. 습식 전환은 동파 방지·열선·보온·내화 구획을 함께 끌고 오고, 그 대부분은 신축이 아니라 방대한 기존 건물 재고에 떨어진다. 소방·열·안전 시스템 브랜드는 규제 강화를 수요 신호로 읽고, 상대적으로 작은 신축 몫이 아니라 개조(리트로핏) 물결에 포지셔닝해야 한다. 기준은 한 방향으로 계속 움직인다. 그것을 앞서 읽는 공급망이 이긴다.</p>
