    <h1 data-en="Pohang Opens Its Door to the World" data-ko="포항, 세계를 향해 문을 열다">포항, 세계를 향해 문을 열다</h1>
    <p class="subtitle" data-en="An international competition for the Pohang Municipal Museum — a steel city bets on memory at the water’s edge." data-ko="포항시립박물관 국제설계공모 — 철의 도시가 물가에서 기억을 짓는다.">포항시립박물관 국제설계공모 — 철의 도시가 물가에서 기억을 짓는다.</p>
    <div class="meta">2026-07-16 <span>&middot;</span> ARCHINODE Editorial</div>
</section>
<article class="article-body">
<p class="lead" data-en="A local city commissioning a cultural landmark through an open international competition is now the global standard. Pohang — long known for its blast furnaces and the waves of Yeongil Bay — has laid out a 15,142㎡ waterfront site, a budget of roughly £15.41 million, and a winning design fee near £790,000, and extended its hand to the world. Registration closes 20 July, submissions are due 7 September, and the result lands 23 September. This is a live competition, and its meaning runs deeper than its budget." data-ko="지방 도시가 국제 공개공모로 문화시설을 발주하는 것은 이제 글로벌 표준 문법이다. 반세기 동안 용광로의 붉은 불빛과 영일만의 파도로 기억되어 온 포항이 15,142㎡ 수변 부지, 사업비 약 15.41M파운드, 당선 설계비 약 79만 파운드라는 조건으로 세계를 향해 손을 내밀었다. 등록 마감 7월 20일, 제출 9월 7일, 결과 발표 9월 23일. 지금 진행 중인 라이브 공모이고, 그 의미는 예산보다 깊다.">지방 도시가 국제 공개공모로 문화시설을 발주하는 것은 이제 글로벌 표준 문법이다. 반세기 동안 용광로의 붉은 불빛과 영일만의 파도로 기억되어 온 포항이 15,142㎡ 수변 부지, 사업비 약 15.41M파운드, 당선 설계비 약 79만 파운드라는 조건으로 세계를 향해 손을 내밀었다. 등록 마감 7월 20일, 제출 9월 7일, 결과 발표 9월 23일. 지금 진행 중인 라이브 공모이고, 그 의미는 예산보다 깊다.</p>
<h2 data-en="A Local City Steps onto the World Stage" data-ko="지방 도시가 세계 무대에 서다">지방 도시가 세계 무대에 서다</h2>
<p data-en="This route is well worn. Ever since Bilbao rewrote the formula of urban regeneration with the Guggenheim in 1997, Helsinki, Taichung and Abu Dhabi have followed the same path. In Korea, Busan Opera House and the Sejong Museum of Architecture led the way, and now Pohang joins them. What matters is not the scale but the coordinate: waterfront plus local history. Since the 2020s, the global museum trend has shifted from landmark spectacle toward low-rise, context-driven buildings that hold the memory of a place — a leaning visible even in the WAF 2026 shortlist." data-ko="이 경로는 익숙하다. 빌바오가 구겐하임(1997)으로 도시 재생의 공식을 다시 쓴 이래 헬싱키·타이중·아부다비가 같은 길을 밟았다. 한국에서도 부산 오페라하우스와 세종 건축박물관이 앞서갔고, 이제 포항이 그 대열에 합류한다. 중요한 것은 규모가 아니라 좌표다. 수변, 그리고 지역사. 2020년대 들어 글로벌 박물관 트렌드는 랜드마크형 스펙터클에서 장소의 기억을 담는 저층·맥락형으로 이동했고, 이 경향은 WAF 2026 숏리스트에서도 뚜렷하다.">이 경로는 익숙하다. 빌바오가 구겐하임(1997)으로 도시 재생의 공식을 다시 쓴 이래 헬싱키·타이중·아부다비가 같은 길을 밟았다. 한국에서도 부산 오페라하우스와 세종 건축박물관이 앞서갔고, 이제 포항이 그 대열에 합류한다. 중요한 것은 규모가 아니라 좌표다. 수변, 그리고 지역사. 2020년대 들어 글로벌 박물관 트렌드는 랜드마크형 스펙터클에서 장소의 기억을 담는 저층·맥락형으로 이동했고, 이 경향은 WAF 2026 숏리스트에서도 뚜렷하다.</p>
<figure><img loading="lazy" src="../assets/magazine/placeholders/architecture.svg" alt="포항 수변 부지 개념 이미지"><figcaption data-en="A 15,142㎡ waterfront site — Pohang’s industrial heritage now seeks an architectural language." data-ko="15,142㎡ 수변 부지 — 포항의 산업 유산이 이제 건축 언어를 찾는다.">15,142㎡ 수변 부지 — 포항의 산업 유산이 이제 건축 언어를 찾는다.</figcaption></figure>
<p data-en="How Pohang translates its identity as a steel town into architecture is the real point to watch. Registration and participation carry no fee, which lowers the barrier for teams worldwide. If this holds, over the next one to three years international competitions commissioned by Korea’s small and mid-sized cities are likely to multiply. This is not a passing fashion but a structural shift, bound up with responses to regional decline and with city branding." data-ko="포항이 철강도시라는 정체성을 어떻게 건축 언어로 번역하느냐가 진짜 관전 포인트다. 등록·참가에 비용이 없어 세계 각지 팀의 진입 장벽도 낮다. 이 흐름이 이어지면 향후 1~3년간 한국 지방 중소도시의 국제공모 발주는 더 늘어날 것으로 보인다. 일시적 유행이 아니라 지방소멸 대응·도시 브랜딩과 맞물린 구조적 변화다.">포항이 철강도시라는 정체성을 어떻게 건축 언어로 번역하느냐가 진짜 관전 포인트다. 등록·참가에 비용이 없어 세계 각지 팀의 진입 장벽도 낮다. 이 흐름이 이어지면 향후 1~3년간 한국 지방 중소도시의 국제공모 발주는 더 늘어날 것으로 보인다. 일시적 유행이 아니라 지방소멸 대응·도시 브랜딩과 맞물린 구조적 변화다.</p>
<h2 data-en="A House of Memory at the Water’s Edge" data-ko="물가에 앉는 기억의 집">물가에 앉는 기억의 집</h2>
<p data-en="Say the name Pohang and people picture the red glow of the furnace and the waves of Yeongil Bay. For half a century this city was a place that made things, not a place that remembered them. That the museum will sit on the water is what makes it resonate. The sea was Pohang’s workplace and its livelihood; now a house that holds the city’s memory rises at that water’s edge. A museum is not a warehouse for artifacts. It is a plaza where a parent leading a child by the hand, a retired steelworker, and a passing traveler cross paths in the same lobby." data-ko="포항이라는 이름을 들으면 사람들은 먼저 용광로의 붉은 불빛과 영일만의 파도를 떠올린다. 이 도시는 반세기 동안 무엇을 만드는 곳이었지, 무엇을 기억하는 곳은 아니었다. 이번 박물관이 물가에 앉는다는 사실이 그래서 의미심장하다. 바다는 포항 사람들에게 일터이자 생계였고, 이제 그 물가에 도시의 기억을 담는 집이 들어선다. 박물관은 유물을 넣어두는 창고가 아니다. 아이 손을 잡은 부모가, 은퇴한 제철소 노동자가, 낯선 여행자가 같은 로비에서 마주치는 광장이다.">포항이라는 이름을 들으면 사람들은 먼저 용광로의 붉은 불빛과 영일만의 파도를 떠올린다. 이 도시는 반세기 동안 무엇을 만드는 곳이었지, 무엇을 기억하는 곳은 아니었다. 이번 박물관이 물가에 앉는다는 사실이 그래서 의미심장하다. 바다는 포항 사람들에게 일터이자 생계였고, 이제 그 물가에 도시의 기억을 담는 집이 들어선다. 박물관은 유물을 넣어두는 창고가 아니다. 아이 손을 잡은 부모가, 은퇴한 제철소 노동자가, 낯선 여행자가 같은 로비에서 마주치는 광장이다.</p>
<blockquote data-en="“An outside gaze lets a city rediscover the scenery it had stopped seeing — the dawn bustle of the fish market, the rough beauty of an industrial town.”" data-ko="“외부의 시선은 정작 이곳 사람들이 당연해서 못 보던 풍경 — 새벽 어시장의 활기, 산업도시의 거친 아름다움 — 을 다시 발견하게 한다.”">“외부의 시선은 정작 이곳 사람들이 당연해서 못 보던 풍경 — 새벽 어시장의 활기, 산업도시의 거친 아름다움 — 을 다시 발견하게 한다.”</blockquote>
<p data-en="Good museums tell a city’s story less in the exhibition halls than in the spaces between them: a stair landing where sunlight falls at an angle, a window-side bench facing the sea. That is exactly why the international-competition format matters. The outside gaze rediscovers the everyday that locals had stopped noticing." data-ko="좋은 박물관은 전시실보다 그 사이의 빈 공간 — 햇빛이 비스듬히 드는 계단참, 바다가 보이는 창가 벤치 — 에서 도시의 이야기를 만든다. 국제공모라는 형식이 중요한 이유도 여기 있다. 외부의 시선은 이곳 사람들이 당연해서 못 보던 일상을 다시 발견하게 한다.">좋은 박물관은 전시실보다 그 사이의 빈 공간 — 햇빛이 비스듬히 드는 계단참, 바다가 보이는 창가 벤치 — 에서 도시의 이야기를 만든다. 국제공모라는 형식이 중요한 이유도 여기 있다. 외부의 시선은 이곳 사람들이 당연해서 못 보던 일상을 다시 발견하게 한다.</p>
<div class="editor-note">
<h3 data-en="Editor&apos;s Note" data-ko="편집장 코멘트">편집장 코멘트</h3>
<p data-en="For ARCHINODE, a waterfront museum is not just a design story but a materials story. Salt air, humidity and strong sun make envelope, cladding and long-term durability decisive. As Korea’s regional cities open more international competitions, demand grows for material brands that can prove weathering performance and low-carbon credentials at once. A local city’s competition is, quietly, a test bed for the materials market." data-ko="ARCHINODE 입장에서 수변 박물관은 디자인만의 이야기가 아니라 자재의 이야기이기도 하다. 염분·습기·강한 일사는 외피, 마감재, 장기 내구성을 승부처로 만든다. 한국 지방 도시의 국제공모가 늘어날수록, 내후 성능과 저탄소 근거를 동시에 증명할 수 있는 자재 브랜드의 수요도 커진다. 지방 도시의 공모는 조용히 자재 시장의 테스트베드가 된다.">ARCHINODE 입장에서 수변 박물관은 디자인만의 이야기가 아니라 자재의 이야기이기도 하다. 염분·습기·강한 일사는 외피, 마감재, 장기 내구성을 승부처로 만든다. 한국 지방 도시의 국제공모가 늘어날수록, 내후 성능과 저탄소 근거를 동시에 증명할 수 있는 자재 브랜드의 수요도 커진다. 지방 도시의 공모는 조용히 자재 시장의 테스트베드가 된다.</p>
</div>
